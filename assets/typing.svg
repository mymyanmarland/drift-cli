<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <style>
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="150" rx="12" fill="#04202b"/>
  <rect width="900" height="34" rx="12" fill="#07303f"/>
  <circle cx="22" cy="17" r="6" fill="#f87171"/>
  <circle cx="46" cy="17" r="6" fill="#fbbf24"/>
  <circle cx="70" cy="17" r="6" fill="#34d399"/>
  <g font-family="monospace" font-size="19">
    <text x="24" y="66" fill="#a5f3fc">$ drift watch https://api.example.com/v1/models
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="94" fill="#8fb8c4">snapshot saved: 142 lines, noise filtered: 3
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.27;0.95;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="122" fill="#a5f3fc">$ drift check
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.47;0.95;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="122" fill="#34d399" font-weight="bold">CHANGED  ~1 changed  +1 added
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.67;0.95;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="252" y="108" width="11" height="20" fill="#22d3ee" class="cursor"/>
</svg>
